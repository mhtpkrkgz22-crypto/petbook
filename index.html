<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Book</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container head">
      <div class="header">
        <div class="header-logo">
          <img src="images/petlogo.jpg" alt="Pet Logo" />
        </div>
        <div class="header-links">
          <a href="#">Link1</a>
          <a href="#">Link2</a>
          <a href="#">Link3</a>
        </div>
      </div>
      <div class="information-header">
        <div class="info-box">
          <div class="info-title"></div>
          <div class="info-text"></div>
          <div class="info-button"></div>
        </div>
        <div class="image-box"></div>
      </div>
    </div>
    <div class="content">
      <div class="content-title"></div>
      <div class="content-body">
        <div class="content-image-box1">
          <div class="image-box-image"></div>
          <div class="image-box-text"></div>
        </div>
        <div class="content-image-box2">
          <div class="image-box-image"></div>
          <div class="image-box-text"></div>
        </div>
        <div class="content-image-box3">
          <div class="image-box-image"></div>
          <div class="image-box-text"></div>
        </div>
        <div class="content-image-box4">
          <div class="image-box-image"></div>
          <div class="image-box-text"></div>
        </div>
      </div>
    </div>
    <div class="text-box">
      <div class="text"></div>
    </div>
  </body>
</html>
